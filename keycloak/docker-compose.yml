# Dev-only Keycloak for the PoC. Realm "poc" is imported from realm-poc.json
# (regenerate it with: python -m poc.keycloak_realm).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # token-exchange-delegation (preview) issues `act` claims; it needs parameterized-scopes and FGAP v2
    command: ["start-dev", "--import-realm", "--http-port=8080",
              "--features=token-exchange-delegation,parameterized-scopes"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./realm-poc.json:/opt/keycloak/data/import/realm-poc.json:ro
