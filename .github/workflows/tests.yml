name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTGATEWAY_VERSION: v1.7.0

jobs:
  mock-idp:
    name: mock IdP / ${{ matrix.gateway }} / py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        gateway: [builtin, agentgateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download agentgateway
        if: matrix.gateway == 'agentgateway'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-agentgateway.sh
      - name: Run tests
        env:
          POC_GATEWAY: ${{ matrix.gateway }}
        run: python -m unittest -v

  keycloak:
    name: Keycloak / ${{ matrix.gateway }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gateway: [builtin, agentgateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start Keycloak
        run: |
          docker compose -f keycloak/docker-compose.yml up -d
          for i in $(seq 1 90); do
            curl -fs http://127.0.0.1:18080/realms/poc/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker compose -f keycloak/docker-compose.yml logs
          exit 1
      - name: Download agentgateway
        if: matrix.gateway == 'agentgateway'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-agentgateway.sh
      - name: Run tests (includes Keycloak delegation tests)
        env:
          POC_IDP: keycloak
          POC_GATEWAY: ${{ matrix.gateway }}
        run: python -m unittest -v
      - name: Keycloak logs on failure
        if: failure()
        run: docker compose -f keycloak/docker-compose.yml logs --tail 200

  extras:
    name: semantic search + A2A SDK agent / ${{ matrix.gateway }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gateway: [builtin, agentgateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Install optional packages
        run: pip install -r requirements-extras.txt
      - name: Download agentgateway
        if: matrix.gateway == 'agentgateway'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-agentgateway.sh
      - name: Run tests (semantic search must be active)
        env:
          POC_GATEWAY: ${{ matrix.gateway }}
          POC_SEARCH: hybrid
        run: python -m unittest -v

  a2a-tck:
    name: A2A TCK (JSON-RPC) / ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # direct: the agent alone; builtin / agentgateway: the same agent behind that gateway, real tokens
        path: [direct, builtin, agentgateway]
    env:
      TCK_COMMIT: 5e6f37c2d38eb3d7684686243c34d365c83df49b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Get the A2A TCK
        run: |
          git clone https://github.com/a2aproject/a2a-tck.git "$RUNNER_TEMP/a2a-tck"
          git -C "$RUNNER_TEMP/a2a-tck" checkout "$TCK_COMMIT"
          cd "$RUNNER_TEMP/a2a-tck" && uv venv --python 3.15 && uv pip install -e .
      - name: Download agentgateway
        if: matrix.path == 'agentgateway'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/get-agentgateway.sh
      - name: Start the system under test
        env:
          POC_GATEWAY: ${{ matrix.path == 'agentgateway' && 'agentgateway' || 'builtin' }}
        run: |
          if [ "${{ matrix.path }}" = direct ]; then
            python -m poc.tck_sut --port 18199 &
          else
            python -m poc.tck_sut --port 18199 --via-gateway &
          fi
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:18199/.well-known/agent-card.json > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run the TCK
        run: cd "$RUNNER_TEMP/a2a-tck" && .venv/bin/python run_tck.py --sut-host http://127.0.0.1:18199 --transport jsonrpc
      - name: Keep the TCK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-tck-report-${{ matrix.path }}
          path: ${{ runner.temp }}/a2a-tck/reports
